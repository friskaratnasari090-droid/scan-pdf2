<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanKu PRO - Pemindai Dokumen & PDF Maker</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --accent: #8b5cf6;
            --bg: #0f172a;
            --surface: #1e293b;
            --card: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --danger: #ef4444;
            --success: #10b981;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--surface);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        @media (min-width: 768px) {
            #app {
                border-radius: 24px;
                height: 85vh;
            }
        }

        /* Header */
        header {
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }

        .brand i { color: var(--primary); }
        .brand span { color: var(--accent); }

        .counter-badge {
            background: rgba(79, 70, 229, 0.2);
            color: #818cf8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(79, 70, 229, 0.4);
        }

        /* Main View Container */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: opacity 0.2s ease;
        }

        .view.hidden { display: none !important; }
        .view.active { display: flex !important; }

        /* 1. HOME VIEW */
        #view-home {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 24px;
            background: radial-gradient(circle at 50% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
        }

        .hero-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .hero-text h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .hero-text p { font-size: 0.85rem; color: var(--text-muted); max-width: 300px; line-height: 1.5; }

        .home-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }

        /* 2. CAMERA VIEW */
        #view-camera {
            background: #000;
            padding: 0;
            justify-content: space-between;
        }

        .cam-box {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cam-video { width: 100%; height: 100%; object-fit: cover; }

        .cam-frame {
            position: absolute;
            width: 82% h;
            width: 82%;
            height: 75%;
            border: 2px dashed rgba(255,255,255,0.6);
            border-radius: 12px;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        .cam-controls {
            height: 100px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
        }

        .btn-round {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shutter-btn {
            width: 68px;
            height: 68px;
            border: 4px solid white;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .shutter-inner {
            width: 52px;
            height: 52px;
            background: white;
            border-radius: 50%;
            transition: transform 0.1s;
        }

        .shutter-btn:active .shutter-inner { transform: scale(0.85); }

        /* 3. EDITOR & CROP VIEW */
        #view-editor {
            padding: 14px;
            background: #090d16;
            justify-content: space-between;
        }

        .editor-canvas-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #020617;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        #editor-canvas {
            display: block;
            max-width: 100%;
            max-height: 48vh;
            object-fit: contain;
        }

        .crop-handle {
            position: absolute;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border: 3px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .crop-svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #crop-polygon {
            fill: rgba(79, 70, 229, 0.25);
            stroke: var(--primary);
            stroke-width: 2;
            stroke-dasharray: 4;
        }

        .editor-tools {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .filter-pill {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .sliders-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .slider-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .slider-group input { width: 100%; accent-color: var(--primary); }

        .editor-btns {
            display: flex;
            gap: 8px;
        }

        /* 4. MANAGER VIEW */
        #view-manager { padding: 20px; gap: 16px; }

        .manager-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .manager-header h2 { font-size: 1.1rem; font-weight: 700; }

        .thumb-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 10px;
        }

        @media(min-width: 400px) {
            .thumb-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .thumb-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .thumb-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: #000;
        }

        .thumb-footer {
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            border-top: 1px solid var(--border);
        }

        .thumb-num { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
        .thumb-actions { display: flex; gap: 4px; }
        
        .t-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 0.8rem; padding: 2px;
        }
        .t-btn.del { color: var(--danger); }

        .manager-footer {
            display: flex;
            gap: 10px;
        }

        /* Modal PDF */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .modal-overlay.hidden { display: none !important; }

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%; max-width: 380px;
            border-radius: 18px;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .modal-top {
            padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .modal-top h3 { font-size: 1rem; font-weight: 700; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; }

        .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

        .input-box { display: flex; flex-direction: column; gap: 5px; }
        .input-box label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        .input-box input {
            background: var(--card); border: 1px solid var(--border);
            color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; outline: none;
        }

        .pdf-preview-box {
            width: 100%; height: 160px; background: var(--card);
            border: 1px dashed var(--border); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #pdf-iframe { width: 100%; height: 100%; border: none; }
        .pdf-placeholder { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.8rem; }
        .pdf-placeholder i { font-size: 2rem; color: var(--primary); }

        .modal-footer { padding: 16px 20px; background: rgba(15, 23, 42, 0.4); border-top: 1px solid var(--border); }

        /* Loading Overlay */
        .loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; z-index: 200;
        }
        .loader.hidden { display: none !important; }
        .spinner {
            width: 38px; height: 38px; border: 4px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader p { font-size: 0.85rem; font-weight: 600; color: #818cf8; }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <header>
            <div class="brand">
                <i class="fa-solid fa-file-shield"></i>
                <span>ScanKu<span>PRO</span></span>
            </div>
            <div id="page-counter" class="counter-badge hidden">0 Hal</div>
        </header>

        <!-- Main Workspace -->
        <main>
            <!-- 1. HOME VIEW -->
            <section id="view-home" class="view active">
                <div class="hero-icon">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div class="hero-text">
                    <h1>Pemindai Dokumen Pintar</h1>
                    <p>Ubah kertas dokumen, tugas, atau catatan fisik menjadi file PDF berkualitas tinggi langsung di browser Anda.</p>
                </div>
                <div class="home-actions">
                    <button class="btn btn-primary" id="btn-open-cam">
                        <i class="fa-solid fa-camera"></i> Scan dengan Kamera
                    </button>
                    <button class="btn btn-secondary" id="btn-open-upload">
                        <i class="fa-solid fa-image"></i> Upload dari Galeri
                    </button>
                    <input type="file" id="file-uploader" accept="image/*" multiple class="hidden">
                </div>
            </section>

            <!-- 2. CAMERA VIEW -->
            <section id="view-camera" class="view hidden">
                <div class="cam-box">
                    <video id="cam-video" autoplay playsinline></video>
                    <canvas id="cam-canvas" class="hidden"></canvas>
                    <div class="cam-frame"></div>
                </div>
                <div class="cam-controls">
                    <button class="btn-round" id="btn-close-cam"><i class="fa-solid fa-xmark"></i></button>
                    <button class="shutter-btn" id="btn-shoot"><div class="shutter-inner"></div></button>
                    <div style="width: 44px;"></div>
                </div>
            </section>

            <!-- 3. EDITOR & CROP VIEW -->
            <section id="view-editor" class="view hidden">
                <div class="editor-canvas-wrap" id="crop-container">
                    <canvas id="editor-canvas"></canvas>
                    <div class="crop-handle" id="h-tl" data-id="tl"></div>
                    <div class="crop-handle" id="h-tr" data-id="tr"></div>
                    <div class="crop-handle" id="h-bl" data-id="bl"></div>
                    <div class="crop-handle" id="h-br" data-id="br"></div>
                    <svg class="crop-svg"><polygon id="crop-polygon" points="" /></svg>
                </div>

                <div class="editor-tools">
                    <div class="filter-row">
                        <button class="filter-pill active" data-filter="magic">Magic Enhance</button>
                        <button class="filter-pill" data-filter="grayscale">B&W Bersih</button>
                        <button class="filter-pill" data-filter="darken">High Contrast</button>
                        <button class="filter-pill" data-filter="original">Original</button>
                    </div>
                    <div class="sliders-row">
                        <div class="slider-group">
                            <label>Kecerahan</label>
                            <input type="range" id="slider-bright" min="-100" max="100" value="0">
                        </div>
                        <div class="slider-group">
                            <label>Kontras</label>
                            <input type="range" id="slider-contrast" min="-100" max="100" value="0">
                        </div>
                    </div>
                    <div class="editor-btns">
                        <button class="btn btn-secondary" style="flex:1;" id="btn-cancel-crop">Batal</button>
                        <button class="btn btn-primary" style="flex:2;" id="btn-save-page">Simpan Halaman</button>
                    </div>
                </div>
            </section>

            <!-- 4. MANAGER VIEW -->
            <section id="view-manager" class="view hidden">
                <div class="manager-header">
                    <h2>Kelola Halaman</h2>
                    <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" id="btn-add-more">
                        <i class="fa-solid fa-plus"></i> Tambah Lagi
                    </button>
                </div>
                <div class="thumb-grid" id="thumb-container"></div>
                <div class="manager-footer">
                    <button class="btn btn-secondary" style="flex:1;" id="btn-preview-pdf">Preview PDF</button>
                    <button class="btn btn-primary" style="flex:1.5;" id="btn-download-pdf">Unduh PDF</button>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL PDF -->
    <div id="pdf-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-top">
                <h3>Konfirmasi Unduh PDF</h3>
                <button class="modal-close" id="modal-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="input-box">
                    <label>Nama File Dokumen</label>
                    <input type="text" id="pdf-filename" value="Dokumen_ScanKu">
                </div>
                <div class="pdf-preview-box">
                    <iframe id="pdf-iframe" class="hidden"></iframe>
                    <div id="pdf-placeholder" class="pdf-placeholder">
                        <i class="fa-solid fa-file-pdf"></i>
                        <span>Menyiapkan PDF...</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" style="width: 100%;" id="btn-confirm-download">
                    <i class="fa-solid fa-download"></i> Download Sekarang
                </button>
            </div>
        </div>
    </div>

    <!-- LOADING SPINNER -->
    <div id="loader" class="loader hidden">
        <div class="spinner"></div>
        <p id="loader-msg">Memproses...</p>
    </div>

    <!-- SCRIPT APLIKASI UTUH -->
    <script>
        let scannedPages = []; // Menyimpan array gambar hasil scan
        let activeStream = null;
        let sourceImageCanvas = null;
        let cropPts = {};
        let currentFilter = 'magic';

        // Navigasi View
        function changeView(viewId) {
            document.querySelectorAll('.view').forEach(v => {
                v.classList.add('hidden');
                v.classList.remove('active');
            });
            document.getElementById(viewId).classList.add('active');

            const badge = document.getElementById('page-counter');
            if (scannedPages.length > 0) {
                badge.classList.remove('hidden');
                badge.innerText = `${scannedPages.length} Hal`;
            } else {
                badge.classList.add('hidden');
            }
        }

        function showLoading(msg) {
            document.getElementById('loader-msg').innerText = msg;
            document.getElementById('loader').classList.remove('hidden');
        }
        function hideLoading() {
            document.getElementById('loader').classList.add('hidden');
        }

        // --- 1. KAMERA & UPLOAD ---
        document.getElementById('btn-open-cam').addEventListener('click', startCamera);
        document.getElementById('btn-close-cam').addEventListener('click', stopCamera);
        document.getElementById('btn-shoot').addEventListener('click', captureCamera);

        document.getElementById('btn-open-upload').addEventListener('click', () => document.getElementById('file-uploader').click());
        document.getElementById('file-uploader').addEventListener('change', handleUploadFiles);
        document.getElementById('btn-add-more').addEventListener('click', () => changeView('view-home'));

        async function startCamera() {
            changeView('view-camera');
            const video = document.getElementById('cam-video');
            try {
                activeStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = activeStream;
            } catch (err) {
                alert('Gagal membuka kamera. Pastikan izin kamera diaktifkan.');
                changeView('view-home');
            }
        }

        function stopCamera() {
            if (activeStream) {
                activeStream.getTracks().forEach(t => t.stop());
                activeStream = null;
            }
            changeView(scannedPages.length > 0 ? 'view-manager' : 'view-home');
        }

        function captureCamera() {
            const video = document.getElementById('cam-video');
            const canvas = document.getElementById('cam-canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            stopCamera();
            loadIntoEditor(canvas);
        }

        function handleUploadFiles(e) {
            const files = e.target.files;
            if (!files.length) return;

            showLoading('Memuat gambar...');
            let loaded = 0;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        canvas.getContext('2d').drawImage(img, 0, 0);

                        if (loaded === 0) {
                            loadIntoEditor(canvas);
                        } else {
                            scannedPages.push({ id: 'p_' + Math.random(), dataUrl: canvas.toDataURL('image/jpeg', 0.85) });
                            renderManager();
                        }
                        loaded++;
                        if (loaded === files.length) hideLoading();
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        // --- 2. EDITOR & CROP INTERAKTIF ---
        let edCanvas = document.getElementById('editor-canvas');
        let edCtx = edCanvas.getContext('2d');

        function loadIntoEditor(canvasSource) {
            sourceImageCanvas = canvasSource;
            changeView('view-editor');

            edCanvas.width = canvasSource.width;
            edCanvas.height = canvasSource.height;
            edCtx.drawImage(canvasSource, 0, 0);

            // Set posisi awal crop (margin 10%)
            let w = canvasSource.width, h = canvasSource.height;
            cropPts = {
                tl: { x: w * 0.1, y: h * 0.1 },
                tr: { x: w * 0.9, y: h * 0.1 },
                br: { x: w * 0.9, y: h * 0.9 },
                bl: { x: w * 0.1, y: h * 0.9 }
            };

            initCropHandles();
            updateCropUI();
            resetFilterSliders();
        }

        function updateCropUI() {
            let sx = edCanvas.width / edCanvas.offsetWidth;
            let sy = edCanvas.height / edCanvas.offsetHeight;

            ['tl', 'tr', 'bl', 'br'].forEach(id => {
                let node = document.getElementById('h-' + id);
                node.style.left = (cropPts[id].x / sx) + 'px';
                node.style.top = (cropPts[id].y / sy) + 'px';
            });

            let pts = `${cropPts.tl.x/sx},${cropPts.tl.y/sy} ${cropPts.tr.x/sx},${cropPts.tr.y/sy} ${cropPts.br.x/sx},${cropPts.br.y/sy} ${cropPts.bl.x/sx},${cropPts.bl.y/sy}`;
            document.getElementById('crop-polygon').setAttribute('points', pts);
        }

        function initCropHandles() {
            let activeId = null;
            document.querySelectorAll('.crop-handle').forEach(h => {
                const start = (e) => { activeId = h.getAttribute('data-id'); e.preventDefault(); };
                h.addEventListener('mousedown', start);
                h.addEventListener('touchstart', start);
            });

            const move = (e) => {
                if (!activeId) return;
                let rect = edCanvas.getBoundingClientRect();
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);

                let x = (clientX - rect.left) * (edCanvas.width / edCanvas.offsetWidth);
                let y = (clientY - rect.top) * (edCanvas.height / edCanvas.offsetHeight);

                x = Math.max(0, Math.min(edCanvas.width, x));
                y = Math.max(0, Math.min(edCanvas.height, y));

                cropPts[activeId] = { x, y };
                updateCropUI();
            };

            const end = () => { activeId = null; };
            window.addEventListener('mousemove', move);
            window.addEventListener('touchmove', move);
            window.addEventListener('mouseup', end);
            window.addEventListener('touchend', end);
        }

        // --- 3. FILTER & IMAGE PROCESSING ---
        document.querySelectorAll('.filter-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                applyFilters();
            });
        });

        document.getElementById('slider-bright').addEventListener('input', applyFilters);
        document.getElementById('slider-contrast').addEventListener('input', applyFilters);

        function resetFilterSliders() {
            currentFilter = 'magic';
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-filter="magic"]').classList.add('active');
            document.getElementById('slider-bright').value = 0;
            document.getElementById('slider-contrast').value = 0;
            applyFilters();
        }

        function applyFilters() {
            if (!sourceImageCanvas) return;
            edCtx.clearRect(0, 0, edCanvas.width, edCanvas.height);
            edCtx.drawImage(sourceImageCanvas, 0, 0);

            let imgData = edCtx.getImageData(0, 0, edCanvas.width, edCanvas.height);
            let d = imgData.data;
            let bright = parseInt(document.getElementById('slider-bright').value);
            let contrast = parseInt(document.getElementById('slider-contrast').value);
            let factor = (259 * (contrast + 255)) / (255 * (259 - contrast));

            for (let i = 0; i < d.length; i += 4) {
                let r = d[i], g = d[i+1], b = d[i+2];

                if (currentFilter === 'grayscale') {
                    let avg = 0.299 * r + 0.587 * g + 0.114 * b;
                    r = g = b = avg;
                } else if (currentFilter === 'magic') {
                    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    let clean = gray > 145 ? 255 : gray * 0.85;
                    r = g = b = clean;
                } else if (currentFilter === 'darken') {
                    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    r = g = b = gray < 120 ? 0 : 255;
                }

                r = factor * (r - 128) + 128 + bright;
                g = factor * (g - 128) + 128 + bright;
                b = factor * (b - 128) + 128 + bright;

                d[i]   = Math.min(255, Math.max(0, r));
                d[i+1] = Math.min(255, Math.max(0, g));
                d[i+2] = Math.min(255, Math.max(0, b));
            }
            edCtx.putImageData(imgData, 0, 0);
        }

        document.getElementById('btn-cancel-crop').addEventListener('click', () => {
            changeView(scannedPages.length > 0 ? 'view-manager' : 'view-home');
        });

        document.getElementById('btn-save-page').addEventListener('click', () => {
            showLoading('Memproses potongan gambar...');
            setTimeout(() => {
                let w = Math.max(
                    Math.hypot(cropPts.tr.x - cropPts.tl.x, cropPts.tr.y - cropPts.tl.y),
                    Math.hypot(cropPts.br.x - cropPts.bl.x, cropPts.br.y - cropPts.bl.y)
                );
                let h = Math.max(
                    Math.hypot(cropPts.bl.x - cropPts.tl.x, cropPts.bl.y - cropPts.tl.y),
                    Math.hypot(cropPts.br.x - cropPts.tr.x, cropPts.br.y - cropPts.tr.y)
                );

                let outCanvas = document.createElement('canvas');
                outCanvas.width = w; outCanvas.height = h;
                let oCtx = outCanvas.getContext('2d');

                oCtx.drawImage(
                    edCanvas,
                    Math.min(cropPts.tl.x, cropPts.bl.x),
                    Math.min(cropPts.tl.y, cropPts.tr.y),
                    w, h, 0, 0, w, h
                );

                scannedPages.push({
                    id: 'p_' + Date.now(),
                    dataUrl: outCanvas.toDataURL('image/jpeg', 0.9)
                });

                hideLoading();
                renderManager();
                changeView('view-manager');
            }, 100);
        });

        // --- 4. MANAGER & PDF EXPORT ---
        function renderManager() {
            let container = document.getElementById('thumb-container');
            container.innerHTML = '';

            scannedPages.forEach((page, idx) => {
                let card = document.createElement('div');
                card.className = 'thumb-card';
                card.innerHTML = `
                    <img src="${page.dataUrl}" class="thumb-img" alt="Hal ${idx+1}">
                    <div class="thumb-footer">
                        <span class="thumb-num">Hal ${idx+1}</span>
                        <div class="thumb-actions">
                            <button class="t-btn" onclick="movePage(${idx}, -1)" ${idx===0?'disabled style="opacity:0.3"':''}><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="t-btn" onclick="movePage(${idx}, 1)" ${idx===scannedPages.length-1?'disabled style="opacity:0.3"':''}><i class="fa-solid fa-chevron-right"></i></button>
                            <button class="t-btn del" onclick="deletePage(${idx})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const badge = document.getElementById('page-counter');
            if (scannedPages.length > 0) {
                badge.classList.remove('hidden');
                badge.innerText = `${scannedPages.length} Hal`;
            } else {
                badge.classList.add('hidden');
                changeView('view-home');
            }
        }

        window.movePage = function(index, dir) {
            let target = index + dir;
            if (target < 0 || target >= scannedPages.length) return;
            let tmp = scannedPages[index];
            scannedPages[index] = scannedPages[target];
            scannedPages[target] = tmp;
            renderManager();
        };

        window.deletePage = function(index) {
            if (confirm('Hapus halaman ini?')) {
                scannedPages.splice(index, 1);
                renderManager();
            }
        };

        // Modal PDF
        const pdfModal = document.getElementById('pdf-modal');
        document.getElementById('btn-preview-pdf').addEventListener('click', openPdfModal);
        document.getElementById('btn-download-pdf').addEventListener('click', openPdfModal);
        document.getElementById('modal-close').addEventListener('click', () => pdfModal.classList.add('hidden'));
        document.getElementById('btn-confirm-download').addEventListener('click', downloadPDF);

        function openPdfModal() {
            if (scannedPages.length === 0) return alert('Belum ada halaman.');
            pdfModal.classList.remove('hidden');

            generatePdfDataUri(uri => {
                document.getElementById('pdf-iframe').src = uri;
                document.getElementById('pdf-iframe').classList.remove('hidden');
                document.getElementById('pdf-placeholder').classList.add('hidden');
            });
        }

        function generatePdfDataUri(callback) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            scannedPages.forEach((p, idx) => {
                if (idx > 0) doc.addPage();
                let pw = 210, ph = 297;
                let img = new Image();
                img.src = p.dataUrl;

                let w = pw;
                let h = (img.height * pw) / img.width;
                if (h > ph) {
                    h = ph;
                    w = (img.width * ph) / img.height;
                }
                doc.addImage(p.dataUrl, 'JPEG', (pw - w)/2, (ph - h)/2, w, h);
            });

            callback(doc.output('datauristring'));
        }

        function downloadPDF() {
            let filename = document.getElementById('pdf-filename').value.trim() || 'Dokumen_ScanKu';
            if (!filename.endsWith('.pdf')) filename += '.pdf';

            showLoading('Mengunduh file PDF...');
            setTimeout(() => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                scannedPages.forEach((p, idx) => {
                    if (idx > 0) doc.addPage();
                    let pw = 210, ph = 297;
                    let img = new Image();
                    img.src = p.dataUrl;

                    let w = pw;
                    let h = (img.height * pw) / img.width;
                    if (h > ph) {
                        h = ph;
                        w = (img.width * ph) / img.height;
                    }
                    doc.addImage(p.dataUrl, 'JPEG', (pw - w)/2, (ph - h)/2, w, h);
                });

                doc.save(filename);
                hideLoading();
                pdfModal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
